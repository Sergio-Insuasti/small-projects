spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/app_db
        driver-class-name: org.postgresql.Driver
        username: app_user
        password: app_password
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true
        properties:
            hibernate:
                '[format_sql]': true
        database: postgresql
        database-platform: org.hibernate.dialect.PostgreSQLDialect